# AuthPolicy del servicio de demostración.
#
# Se declara sobre el HTTPRoute de la aplicación y, por tanto, SUSTITUYE a la
# política por defecto del gateway para esta ruta concreta. Es el patrón normal:
# la plataforma fija un mínimo seguro y cada API lo afina.
#
# Comprobación esperada: sin cabecera Authorization -> 401; con un token válido
# emitido por el realm de confianza -> 200.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: servicio-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: servicio-demo
  rules:
    authentication:
      token-valido:
        jwt:
          issuerUrl: https://sso.apps.cluster-qthlq.dyn.redhatworkshops.io/realms/workshop
        credentials:
          authorizationHeader:
            prefix: Bearer
    # La respuesta de éxito propaga la identidad al servicio de backend en una
    # cabecera, para que la aplicación sepa quién llama sin validar el token.
    response:
      success:
        headers:
          x-identidad:
            json:
              properties:
                sujeto:
                  selector: auth.identity.sub
                cliente:
                  selector: auth.identity.azp
