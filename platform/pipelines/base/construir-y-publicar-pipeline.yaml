# Pipeline que construye la imagen del servicio y la publica en el registro.
#
# Es el eslabón entre el repositorio de CÓDIGO y el de CONFIGURACIÓN: toma el
# código de workshop-app, produce una imagen y la deja en el registro. A partir
# de ahí es Argo CD quien decide qué se despliega, leyendo el repositorio de
# configuración. El pipeline NO despliega: separar construcción de despliegue es
# justamente lo que hace auditable el flujo.
#
# Las Task reutilizadas (git-clone y buildah) las proporciona el operador
# OpenShift Pipelines; se referencian con el resolver "cluster" en lugar de
# copiarlas al repositorio.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: construir-y-publicar
  labels:
    app.kubernetes.io/part-of: workshop-gitops
spec:
  params:
    - name: repo-url
      type: string
      description: URL del repositorio de código de la aplicación.
      default: https://github.com/rh-workshop/workshop-app.git
    - name: revision
      type: string
      description: Rama o commit que se construye.
      default: main
    - name: imagen
      type: string
      description: Referencia completa de la imagen que se va a publicar.
    - name: containerfile
      type: string
      description: Ruta del Containerfile dentro del repositorio.
      default: ./Containerfile

  workspaces:
    # Espacio compartido entre las dos tareas: git-clone deja ahí el código y
    # buildah lo lee para construir la imagen.
    - name: fuente
      description: Código fuente clonado del repositorio de la aplicación.

  tasks:
    - name: clonar
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: output
          workspace: fuente
      params:
        - name: URL
          value: $(params.repo-url)
        - name: REVISION
          value: $(params.revision)

    - name: construir-y-publicar
      runAfter:
        - clonar
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      workspaces:
        - name: source
          workspace: fuente
      params:
        - name: IMAGE
          value: $(params.imagen)
        - name: DOCKERFILE
          value: $(params.containerfile)
        # El registro interno de OpenShift presenta un certificado firmado por
        # la CA interna del cluster, que no está en el almacén de confianza de
        # la imagen de buildah.
        - name: TLS_VERIFY
          value: "false"

  results:
    # Un result del Pipeline solo puede referenciar el result de una Task, no un
    # parámetro: el webhook de validación de Tekton rechaza lo segundo. Se expone
    # el digest que calcula la tarea de construcción, que además es la referencia
    # inmutable y exacta de lo que se publicó.
    - name: imagen-digest
      description: Digest de la imagen construida y publicada.
      value: $(tasks.construir-y-publicar.results.IMAGE_DIGEST)
