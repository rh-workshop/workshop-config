# TLSPolicy: delega en cert-manager la emisión del certificado del listener.
#
# Nota de orden: la TLSPolicy debe existir para que el Secret del certificado se
# genere y el Gateway pueda quedar "Programmed". Si se aplica después, el
# gateway queda esperando el certificado.
apiVersion: kuadrant.io/v1
kind: TLSPolicy
metadata:
  name: shared-gateway-tls
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: shared-gateway
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    # En el entorno del workshop se usa un emisor autofirmado. En una
    # plataforma real sería una CA corporativa o un emisor ACME.
    name: selfsigned
