# Namespace del equipo de plataforma, donde vive el gateway compartido.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-gateway
  labels:
    # Autoriza al controlador de Argo CD a gestionar recursos en este namespace.
    # Sin esta etiqueta, Argo CD puede leer pero no crear: la sincronización
    # falla con "forbidden" al intentar crear el Deployment o el Service.
    argocd.argoproj.io/managed-by: openshift-gitops
    app.kubernetes.io/part-of: workshop-plataforma
