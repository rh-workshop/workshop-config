# Instancia de Kuadrant, el plano de control de Connectivity Link.
#
# Distinción importante del material: la INSTALACIÓN del operador (Subscription
# y OperatorGroup) se hace una sola vez fuera de este flujo, y la CONFIGURACIÓN
# —este Custom Resource y las políticas— es lo que gobierna Argo CD. Mezclar
# ambas cosas lleva a que Argo pelee con OLM por la propiedad de los recursos.
#
# Al crearse, el operador despliega los componentes que aplican las políticas:
# Authorino (autenticación y autorización) y Limitador (límites de consumo).
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  labels:
    app.kubernetes.io/part-of: workshop-plataforma
spec: {}
