# Exposición del servicio de pruebas a través del gateway compartido.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: servicio-demo
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
  hostnames:
    - demo-test.apps.cluster-qthlq.dyn.redhatworkshops.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: servicio-demo
          port: 8080
