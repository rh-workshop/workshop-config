# Overlay del entorno de desarrollo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workshop-demo-dev

resources:
  - ../../base
  - namespace.yaml
  - servicio-demo-httproute.yaml

# La imagen se resuelve contra el registro interno de OpenShift. En una
# plataforma real este valor apuntaría al registro corporativo (Quay).
images:
  - name: servicio-demo
    newName: image-registry.openshift-image-registry.svc:5000/workshop-demo-dev/servicio-demo
    newTag: "1.0.0"

# En desarrollo basta una réplica; los valores de configuración identifican
# el entorno en la respuesta del servicio.
patches:
  - path: servicio-demo-configmap.yaml
    target:
      kind: ConfigMap
      name: servicio-demo-config
